[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhijiang-agent"
version = "0.1.0"
description = "绘声绘课 LivelyClass：将有使用权的 PDF 转为可溯源教学视频与 PPTX 课件"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "fonttools>=4.60,<5",
  "Pillow>=11,<13",
  "resvg_py==0.5.0",
  "jieba>=0.42.1,<1",
  "python-pptx>=1.0.2,<2",
  "imageio-ffmpeg>=0.6,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "pypdfium2>=5,<6",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
math-animation = [
  "manim==0.21.0",
  "sympy>=1.14,<2",
  "pymupdf>=1.24,<2",
]
test = [
  "pytest>=8,<10",
  "reportlab>=4,<5",
]
local-tts = [
  "kokoro-onnx==0.6.1",
  "misaki[zh]==0.7.4",
]

[tool.setuptools.packages.find]
include = ["zhijiang*"]

[tool.setuptools.package-data]
zhijiang = ["static/*", "powershell/*", "assets/visuals/*.md", "assets/visuals/**/*.md", "assets/visuals/**/*.svg", "assets/visuals/**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
